/* ============================================================
   Remote Call Management — design tokens
   Palette: slate-navy chrome, single action blue, amber signal
   ============================================================ */
:root{
  /* Straight off the Prostarm mark: #0066B3 blue, #069EDB cyan, #F01C24 red */
  --ink:#04263F; --ink-2:#07395C; --ink-3:#0A4F7E;
  --canvas:#EEF3F8; --surface:#FFFFFF; --surface-2:#F5F9FC;
  --line:#D8E3ED; --line-2:#C0D2E0;
  --text:#132836; --muted:#5B7285; --muted-2:#8699A9;
  --primary:#0066B3; --primary-d:#004E8C; --primary-l:#E3F0FA;
  --cyan:#069EDB; --cyan-l:#E2F5FD;
  --signal:#069EDB; --signal-l:#E2F5FD;
  --danger:#D81E26; --danger-l:#FDEBEC;
  --ok:#0B8A5C; --ok-l:#E4F5EE;
  --radius:6px; --radius-lg:10px;
  --shadow:0 1px 2px rgba(19,34,52,.08), 0 4px 14px rgba(19,34,52,.06);
  --shadow-lg:0 12px 40px rgba(19,34,52,.22);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sidebar-w:246px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.012em;line-height:1.25}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- Login ---------- */
.login-wrap{min-height:100%;display:grid;grid-template-columns:1.05fr .95fr}
.login-art{color:#fff;padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#04243C 0%,#08477A 44%,#0066B3 100%)}
/* hexagon texture lifted from the Prostarm banner, mirrored on both edges */
.login-hex{position:absolute;top:0;bottom:0;width:52%;pointer-events:none;
  background:var(--img-hex) no-repeat left center/cover;mix-blend-mode:screen;opacity:.55;
  -webkit-mask-image:linear-gradient(to right,#000 26%,transparent 98%);
          mask-image:linear-gradient(to right,#000 26%,transparent 98%)}
.login-hex.l{left:0}
.login-hex.r{right:0;transform:scaleX(-1)}
.login-art:after{content:"";position:absolute;inset:auto -140px -170px auto;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(41,171,226,.42), rgba(14,107,168,0) 64%)}
/* outline power mark as a large, quiet watermark */
.login-watermark{position:absolute;right:5%;bottom:9%;width:250px;height:250px;opacity:.13;pointer-events:none;
  background:var(--img-mark) no-repeat center/contain;filter:brightness(4)}
.login-art>*{position:relative;z-index:2}
.login-art>.login-hex{position:absolute;z-index:0}
.login-art>.login-watermark{position:absolute;z-index:1}
.login-art .mark{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:10px 16px;
  box-shadow:0 10px 30px rgba(3,14,26,.35);align-self:flex-start}
.wordmark{display:block;background:var(--img-word) no-repeat center/contain}
.login-art .mark .wordmark{height:34px;width:165px}
.login-art h1{font-size:33px;line-height:1.14;max-width:15ch;margin:22px 0 14px;letter-spacing:-.01em}
.login-art p{color:#A9BDD1;max-width:44ch;margin:0}
.login-stats{display:flex;gap:34px;position:relative;z-index:2}
.login-stats div b{display:block;font-size:24px;font-weight:650}
.login-stats div small{color:#93A9BF}
.login-form{background:var(--surface);display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-card{width:100%;max-width:360px}
.login-card h2{font-size:22px;margin-bottom:6px}
.login-card>p.sub{color:var(--muted);margin:0 0 26px}
.demo-note{margin-top:22px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px;color:var(--muted)}
.demo-note b{color:var(--text)}
.user-load{margin-top:22px;padding:16px;border:1px solid var(--line);border-left:3px solid var(--primary);
  border-radius:var(--radius);background:var(--surface-2)}
.user-load b{display:block;font-size:13.5px;color:var(--text);margin-bottom:4px}
.user-load p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.5}
.user-load .fld{margin-bottom:10px}
.user-load .btn-row{display:flex;gap:8px}
.user-load .note{margin-top:10px}
.rl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:14px 0 4px}
.rl-box{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);display:flex;flex-direction:column;min-height:250px}
.rl-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.rl-n{background:var(--ink);color:#fff;border-radius:20px;font-size:11px;font-weight:650;padding:2px 9px;font-variant-numeric:tabular-nums}
.rl-list{flex:1;overflow-y:auto;max-height:230px;padding:6px}
.rl-row{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:6px 8px;margin-bottom:5px;font-size:12.5px}
.rl-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.rl-x:hover{color:var(--danger)}
.rl-empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:12.5px}
.rl-add{padding:8px;border-top:1px solid var(--line)}
.demo-note code{font-family:var(--mono);background:#fff;border:1px solid var(--line);padding:1px 5px;border-radius:4px}

/* ---------- App shell ---------- */
.app{display:none;min-height:100vh}
.app.on{display:block}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--ink);color:#C6D5E4;display:flex;flex-direction:column;z-index:40}
.sb-brand{padding:16px 18px 15px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px;color:#fff;
  background:linear-gradient(180deg,rgba(14,107,168,.22),rgba(14,107,168,0))}
.sb-brand .logo{width:34px;height:34px;border-radius:9px;background:#fff var(--img-icon) no-repeat center/22px 22px;flex:none;
  box-shadow:0 2px 8px rgba(0,0,0,.28)}
.sb-brand b{font-size:14.5px;letter-spacing:-.01em}
.sb-brand small{display:block;color:#8AA2BA;font-size:11px;font-weight:400;letter-spacing:.02em}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 24px}
.sb-group{margin-top:14px;padding:0 8px 6px;font-size:11px;color:#6F89A3;letter-spacing:.06em;text-transform:uppercase}
.sb-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);color:#C6D5E4;cursor:pointer;font-size:13.5px;margin-bottom:1px;border:0;background:none;width:100%;text-align:left}
.sb-link:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-link.active{background:var(--primary);color:#fff;font-weight:550}
.sb-link .ic{width:16px;height:16px;flex:none;opacity:.9}
.sb-link .cnt{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:1px 7px;font-size:11px}
.sb-link.active .cnt{background:rgba(255,255,255,.25)}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7E96AE}

.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(160%) blur(6px);border-bottom:1px solid var(--line);padding:0 22px;height:58px;display:flex;align-items:center;gap:16px}
.topbar h2{font-size:16.5px}
.topbar .crumb{color:var(--muted-2);font-size:12.5px}
.topbar .spacer{flex:1}
.usr{display:flex;align-items:center;gap:9px;padding:5px 9px 5px 5px;border:1px solid var(--line);border-radius:30px;background:#fff;cursor:pointer}
.usr .av{width:28px;height:28px;border-radius:50%;background:var(--ink-3);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:650}
.usr b{font-size:13px;font-weight:600;display:block;line-height:1.15}
.usr small{font-size:11px;color:var(--muted)}
.page{padding:22px;flex:1;max-width:1560px;width:100%}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:var(--radius);width:34px;height:34px;cursor:pointer}

/* ---------- Cards / KPI ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:14.5px}
.card-h .spacer{flex:1}
.card-b{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:13px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--primary))}
.kpi .lbl{font-size:12px;color:var(--muted);margin-bottom:5px}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em}
.kpi .sub{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
/* Dashboard: one uniform grid. Every card is the same height, and anything
   that can run long scrolls inside its own card instead of stretching it. */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;grid-auto-rows:368px}
.dgrid.tall{grid-auto-rows:392px}
.dgrid>.card{align-self:stretch;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.dgrid>.card>.card-h{flex:none}
.dgrid>.card>.card-b,.dgrid>.card>div:not(.card-h){flex:1;min-height:0;overflow:hidden}
.dgrid .scroll{overflow-y:auto;overscroll-behavior:contain}
.dgrid .scroll::-webkit-scrollbar{width:8px}
.dgrid .scroll::-webkit-scrollbar-thumb{background:#CBD6E0;border-radius:8px}
.dgrid .scroll::-webkit-scrollbar-track{background:transparent}
.dgrid .card-b{overflow-y:auto}
@media (max-width:860px){ .dgrid,.dgrid.tall{grid-auto-rows:auto} .dgrid>.card{max-height:400px} }

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--line-2);background:#fff;cursor:pointer;font-size:13px;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:#AFBECD}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn.dgr{background:#fff;border-color:#E3B3AD;color:var(--danger)}
.btn.dgr:hover{background:var(--danger-l)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.gho{border-color:transparent;background:transparent}
.btn.gho:hover{background:var(--surface-2);border-color:var(--line)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Forms ---------- */
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#2C3E50}
.fld>label .req{color:var(--danger);margin-left:2px}
.fld .hint{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--radius);background:#fff;font-size:13.5px}
.inp:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(14,107,168,.13)}
.inp[readonly],.inp:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
textarea.inp{resize:vertical;min-height:82px}
.inp.err{border-color:var(--danger);background:#FFF9F8}
.err-msg{color:var(--danger);font-size:11.5px;margin-top:4px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
.frow.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.counter{float:right;font-weight:400;color:var(--muted-2);font-size:11.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 14px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:#fff;font-weight:550}
fieldset.box{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px}
fieldset.box>legend{font-size:12px;font-weight:650;color:var(--primary-d);padding:0 6px}

/* ---------- Combobox ---------- */
.cb{position:relative}
.cb .cb-in{width:100%;padding:8px 30px 8px 10px;border:1px solid var(--line-2);border-radius:var(--radius);background:#fff;font-size:13.5px}
.cb .cb-in:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(14,107,168,.13)}
.cb .cb-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted-2);font-size:15px;line-height:1;padding:4px}
.cb-pop{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 3px);background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:280px;overflow-y:auto}
.cb-opt{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #F1F4F7}
.cb-opt:last-child{border-bottom:0}
.cb-opt:hover,.cb-opt.hi{background:var(--primary-l)}
.cb-opt b{display:block;font-weight:600}
.cb-opt small{color:var(--muted);font-size:11.5px}
.cb-opt.special{background:var(--signal-l);font-weight:600;color:#8A5406}
.cb-sep{padding:5px 10px;font-size:11px;color:var(--muted-2);background:var(--surface-2);text-transform:uppercase;letter-spacing:.05em}
.cb-empty{padding:12px;color:var(--muted);font-size:12.5px;text-align:center}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:var(--surface-2);text-align:left;padding:9px 12px;font-size:11.5px;color:#43586B;font-weight:650;letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--primary)}
table.tbl td{padding:9px 12px;border-bottom:1px solid #EEF2F6;vertical-align:top}
table.tbl tbody tr:hover{background:#F8FBFD}
table.tbl tr.clk{cursor:pointer}
table.tbl td.nowrap,table.tbl th.nowrap{white-space:nowrap}
.tid{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--primary-d)}
.cellsub{display:block;color:var(--muted-2);font-size:11.5px}
.tbl-foot{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pager{display:flex;gap:4px;margin-left:auto;align-items:center}
.pager button{border:1px solid var(--line-2);background:#fff;border-radius:4px;min-width:28px;height:28px;cursor:pointer;font-size:12.5px}
.pager button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:44px 20px;text-align:center;color:var(--muted);position:relative}
.empty:before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;
  background:var(--img-icon) no-repeat center/contain;opacity:.16;pointer-events:none}
.empty>*{position:relative}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px}

/* ---------- Badges ---------- */
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.bdg.st-new{background:#E7EFFD;color:#1D4ED8}
.bdg.st-assigned{background:#EDE9FE;color:#6D28D9}
.bdg.st-progress{background:#DFF3F8;color:#0E7490}
.bdg.st-pending{background:var(--signal-l);color:#92610B}
.bdg.st-resolved{background:var(--ok-l);color:var(--ok)}
.bdg.st-closed{background:#E8EDF2;color:#44586B}
.bdg.st-hold{background:#F2ECFB;color:#6B46C1}
.bdg.st-visit{background:var(--cyan-l);color:#075E85}
.bdg.st-reopened{background:var(--danger-l);color:var(--danger)}
.bdg.st-cancelled{background:#EFF2F5;color:#8A9AA9}
.bdg.tone-b{background:var(--primary-l);color:var(--primary-d)}
.bdg.tone-a{background:var(--signal-l);color:#8A5406}
.bdg.tone-g{background:var(--ok-l);color:var(--ok)}
.bdg.tone-n{background:#EDF1F5;color:#4E6072}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line-2);border-radius:4px;font-size:11px;color:var(--muted);background:var(--surface-2)}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.toolbar .f{min-width:135px}
.toolbar .f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600}
.toolbar .f .inp{padding:6px 9px;font-size:13px}
.toolbar .grow{flex:1;min-width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-l);color:var(--primary-d);border-radius:20px;padding:2px 6px 2px 10px;font-size:12px;font-weight:550}
.chip button{border:0;background:none;cursor:pointer;color:inherit;font-size:14px;line-height:1;padding:0 3px}

/* ---------- Modal / drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(19,34,52,.45);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:620px;animation:pop .16s ease-out}
.modal.wide{max-width:960px}
.modal.xwide{max-width:1180px}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-h h3{font-size:16px}
.modal-h .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.modal-b{padding:18px;max-height:70vh;overflow-y:auto}
.modal-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 var(--radius-lg) var(--radius-lg);flex-wrap:wrap}
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:11px 15px;border-radius:var(--radius);box-shadow:var(--shadow-lg);font-size:13px;max-width:340px;animation:pop .16s ease-out;display:flex;gap:9px;align-items:flex-start}
.toast.ok{background:var(--ok)} .toast.err{background:var(--danger)} .toast.warn{background:var(--signal)}

/* ---------- Detail / timeline ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
.dl .it label{display:block;font-size:11px;color:var(--muted);letter-spacing:.03em;margin-bottom:2px}
.dl .it div{font-size:13.5px;word-break:break-word}
.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 16px}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-25px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-l)}
.tl li.mut:before{background:var(--muted-2);box-shadow:0 0 0 2px #E8EDF2}
.tl li time{display:block;font-size:11.5px;color:var(--muted-2);font-family:var(--mono)}
.tl li b{font-size:13.5px;font-weight:600}
.tl li p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;background:var(--surface-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 13px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary-d);border-bottom-color:var(--primary);font-weight:600}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart.donut-svg{width:auto;height:auto;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.bar-row{display:grid;grid-template-columns:minmax(90px,32%) 1fr auto;gap:10px;align-items:center;margin-bottom:9px;font-size:12.5px}
.bar-row .track{height:9px;background:#EDF1F5;border-radius:20px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--primary);border-radius:20px}
.bar-row .v{font-weight:650;font-size:12.5px;min-width:26px;text-align:right}
.bar-row span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3C4F60}

/* ---------- Import preview ---------- */
.imp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.imp-sum div{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px}
.imp-sum b{display:block;font-size:20px;font-weight:650}
.imp-sum small{color:var(--muted);font-size:11.5px}
.drop{border:2px dashed var(--line-2);border-radius:var(--radius-lg);padding:26px;text-align:center;background:var(--surface-2);cursor:pointer}
.drop.over{border-color:var(--primary);background:var(--primary-l)}
.drop b{display:block;margin-bottom:4px}
.drop small{color:var(--muted)}

/* ---------- Misc ---------- */
.note{padding:11px 13px;border-radius:var(--radius);font-size:12.5px;border:1px solid}
.note.info{background:var(--primary-l);border-color:#BCD9EC;color:#0B4E79}
.note.warn{background:var(--signal-l);border-color:#EFD8AE;color:#7A5309}
.note.ok{background:var(--ok-l);border-color:#B7DFD0;color:#0B5C41}
.sec-title{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-title h3{font-size:15px}
.sec-title .spacer{flex:1}
.mut{color:var(--muted)}
.sm{font-size:12.5px}
.mono{font-family:var(--mono);font-size:12px}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.login-mini{display:none}
@media (max-width:1000px){
  .login-wrap{grid-template-columns:1fr;align-items:start}
  .login-art{display:none}
  .login-form{align-items:flex-start;padding:26px 22px 40px}
  .login-mini{display:block;margin-bottom:26px}
  .login-mini .mini-logo{height:34px;width:165px;margin-bottom:2px}
  .login-mini h1{font-size:23px;line-height:1.2;margin:14px 0 0;color:var(--ink);max-width:16ch}
}
@media (max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .18s ease}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .menu-btn{display:block}
  .page{padding:14px}
  .topbar{padding:0 14px}
  .usr small{display:none}
  #pgCrumb{display:none}
  #pgTitle{font-size:16px;white-space:nowrap}
  .scrim{position:fixed;inset:0;background:rgba(19,34,52,.4);z-index:35}
}
@media print{.sidebar,.topbar,.btn,.toolbar{display:none !important}.main{margin:0}.card{box-shadow:none}}

/* ---------- login role list + source note ---------- */
.login-roles{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px;max-width:430px}
.login-roles li{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:baseline;font-size:12.5px;
  padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.login-roles li b{color:#fff;font-weight:650}
.login-roles li span{color:rgba(255,255,255,.62)}
.login-roles li.mut b{color:rgba(255,255,255,.55);font-weight:550}
.src-note{margin-top:14px;font-size:11.5px;color:var(--mut)}
.src-note.ok{color:var(--ok)} .src-note.warn{color:var(--signal)}

/* ---------- dashboard: hero metrics ---------- */
.grid2>.card{align-self:start}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.hero-k{background:var(--card);padding:16px 18px}
.hero-k.click{cursor:pointer;transition:background .12s}
.hero-k.click:hover{background:#F7FAFC}
.hero-k .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:650}
.hero-k .val{font-size:30px;font-weight:680;color:var(--ink);line-height:1.15;margin-top:6px;display:flex;align-items:baseline;gap:8px}
.hero-k .trend{font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:20px;background:#EEF3F7;color:var(--mut)}
.hero-k .trend.up{background:rgba(15,123,87,.12);color:var(--ok)}
.hero-k .trend.dn{background:rgba(180,35,42,.10);color:var(--danger)}
.hero-k .sub{font-size:11.5px;color:var(--mut);margin-top:4px}

/* ---------- pipeline strip ---------- */
/* small segmented switch used on dashboard cards */
.seg.sm{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface-2)}
.seg.sm button{border:0;background:none;padding:4px 10px;font-size:11.5px;color:var(--muted);cursor:pointer}
.seg.sm button+button{border-left:1px solid var(--line)}
.seg.sm button.on{background:var(--primary);color:#fff;font-weight:600}
.minibar{display:block;height:6px;border-radius:6px;background:#EEF3F7;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--primary)}
td.warn-t{color:var(--danger);font-weight:650}
.pipe-band{display:flex;gap:2px;height:8px;border-radius:6px;overflow:hidden;background:#E8EEF4;margin:2px 0 14px}
.pipe-band i{display:block;min-width:3px;transition:flex .3s ease}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.pipe.one-row{display:flex;gap:0;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pipe.one-row>.pipe-s{flex:1 1 0;min-width:112px}
.pipe.one-row::-webkit-scrollbar{height:7px}
.pipe.one-row::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:7px}
.pipe-s{position:relative;background:none;border:0;border-right:1px solid var(--line);padding:4px 14px 2px;text-align:left;
  cursor:pointer;transition:background .12s ease}
.pipe-s:last-child{border-right:0}
.pipe-s:hover{background:var(--surface-2)}
.pipe-s .hd{display:flex;align-items:center;gap:6px;min-height:30px}
.pipe-s .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.pipe-s .t{font-size:11px;color:var(--muted);line-height:1.25;letter-spacing:.01em;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pipe-s .n{display:block;font-size:24px;font-weight:680;color:var(--ink);line-height:1.15;margin-top:4px}
.pipe-s .p{display:block;font-size:11px;color:var(--muted-2);margin-top:1px}
.pipe-s.zero .n{color:var(--muted-2)}
.pipe-s:after{content:"";position:absolute;left:14px;right:14px;bottom:-2px;height:3px;border-radius:3px;
  background:var(--c);opacity:0;transition:opacity .12s ease}
.pipe-s:hover:after{opacity:1}

/* ---------- leaderboard + activity feed ---------- */
.lead-r{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.lead-r:last-child{border-bottom:0}
.lead-r .rk{width:20px;font-size:12px;color:var(--mut);font-weight:650}
.lead-r .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:650}
.lead-r .who{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.lead-r .who b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-r .st{font-size:16px;font-weight:680;text-align:right;min-width:48px}
.lead-r .st small{display:block;font-size:10px;color:var(--mut);font-weight:500}
.feed-i{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.feed-i:last-child{border-bottom:0}
.feed-i .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--mut)}
.feed-i .dot.b{background:var(--primary)} .feed-i .dot.g{background:var(--ok)} .feed-i .dot.r{background:var(--danger)}
.feed-i b{text-transform:capitalize}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.tbl td.r,.tbl th.r{text-align:right} .tbl td.c,.tbl th.c{text-align:center}
.tbl.perm td{font-size:12.5px} .tbl.perm input{width:16px;height:16px}

/* ---------- cascade step numbers ---------- */
.stepn{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:10px;font-weight:650;margin-right:6px}
.frow.f2{grid-template-columns:1fr 1fr}

/* ---------- photos ---------- */
.phot-drop{border:1.5px dashed var(--line-2,#CBD6E0);border-radius:9px;padding:16px;text-align:center;cursor:pointer;
  background:#FAFCFD;transition:border-color .12s,background .12s}
.phot-drop:hover,.phot-drop.over{border-color:var(--primary);background:#F3F8FC}
.phot-drop.full{opacity:.5;cursor:not-allowed}
.phot-cta b{display:block;font-size:13px;color:var(--primary)}
.phot-cta span{display:block;margin-top:3px}
.phot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.phot-th{margin:0;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.phot-th img{display:block;width:100%;height:78px;object-fit:cover;cursor:zoom-in}
.phot-th figcaption{font-size:10px;color:var(--mut);padding:4px 6px;border-top:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phot-th .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border:0;border-radius:50%;
  background:rgba(19,34,52,.72);color:#fff;font-size:14px;line-height:1;cursor:pointer}
.phot-view{background:#0E1620;border-radius:8px;display:grid;place-items:center;padding:10px}
.phot-view img{max-width:100%;max-height:62vh;border-radius:4px}
.tabs button .cnt{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:10px;background:#EEF3F7;font-size:10.5px;color:var(--mut)}
</style>
</head>
<body>

<!-- ===================== APP ===================== -->
<div id="appView" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <span class="logo" role="img" aria-label="Prostarm"></span>
      <div><b>Call Management</b><small>Remote support desk</small></div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">v1.0 · local data store</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
      <div>
        <h2 id="pgTitle">Dashboard</h2>
        <div class="crumb" id="pgCrumb"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn sm" id="quickNew">New call</button>
      <div class="usr" id="usrChip">
        <span class="av" id="usrAv">--</span>
        <div><b id="usrName">—</b><small id="usrRole">—</small></div>
      </div>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>



<div class="toast-wrap" id="toasts"></div>
<div id="modalRoot"></div>


<script src="app-shared.js"></script>
<script>
/* ============================================================
   APP PAGE BOOT
   This page assumes the person is already signed in. If there is no
   valid (unexpired) session, it bounces straight to login.html before
   rendering anything — there is no login form on this page.

   NOTE — this is a client-side gate, not a server-side one. On a
   fully static host (GitHub Pages / SharePoint doc library) it stops
   this page from ever *rendering* without a session, but the file's
   source is only truly hidden if the hosting layer itself restricts
   who can fetch it (a private repo, or SharePoint library permissions).
   The data itself stays protected because every Power Automate flow
   re-checks the employee's role from the Users list rather than
   trusting whatever the browser sends.
   ============================================================ */
(function bootApp(){
  Store.load();

  if(!Session.restore()){ location.replace('login.html'); return; }

  const u = Session.user;
  $('#appView').classList.add('on');
  $('#usrAv').textContent = initials(u.fullName);
  $('#usrName').textContent = u.fullName;
  $('#usrRole').textContent = (ROLES[u.role] || {}).label + ' · ' + u.employeeId + (u.branch ? ' · ' + u.branch.replace('_', ' ') : '');
  $('#quickNew').classList.toggle('hide', !can('call.create'));

  $('#menuBtn').onclick = () => {
    const sb = $('#sidebar');
    sb.classList.toggle('open');
    if(sb.classList.contains('open')){
      const s = document.createElement('div'); s.className = 'scrim';
      s.onclick = () => { sb.classList.remove('open'); s.remove(); };
      document.body.appendChild(s);
    } else { const s = $('.scrim'); if(s) s.remove(); }
  };
  $('#quickNew').onclick = () => go('newcall');
  $('#usrChip').onclick = () => go('settings');

  go('dashboard');

  /* refresh the assignment directory in the background */
  spLoadDirectory().then(n => { if(n && typeof currentView !== 'undefined') go(currentView || 'dashboard'); });

  if(u.mustChange) setTimeout(() => {
    const body = document.createElement('div');
    body.innerHTML = '<p style="margin:0 0 14px">You are still on the default password. Set your own before you start logging calls.</p>' +
      '<div class="fld"><label>New password</label><input type="password" class="inp" id="np1" placeholder="At least 8 characters"></div>' +
      '<div class="fld"><label>Repeat password</label><input type="password" class="inp" id="np2"></div>';
    const h = Modal.open({ title:'Change your password', body, dismissable:false, buttons:[
      { label:'Later' },
      { label:'Save password', cls:'pri', onClick(){
          const a = $('#np1', body).value, b = $('#np2', body).value;
          if(a !== b){ toast('The two passwords do not match.', 'err'); return; }
          try { API.changePassword(Session.user.employeeId, a); h.close(); toast('Password changed.', 'ok'); }
          catch(e){ toast(e.message, 'err'); }
        } }
    ]});
  }, 700);

  setInterval(() => {
    if(Session.user && Date.now() - Session.startedAt > CONFIG.sessionMinutes * 60000){
      API.logout(); toast('Session expired. Pls sign in again.', 'warn');
      setTimeout(() => location.href = 'login.html', 1200);
    }
  }, 30000);
})();
</script>

</body>
</html>
